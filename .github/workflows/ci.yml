# Continuous integration: type-check, lint, and Rust tests.
#
# This job intentionally stays fast — it does NOT build the Tauri bundles
# (AppImage/deb/rpm). Bundle building is expensive and only belongs in the
# release workflow (release.yml, triggered on `v*` tags).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also callable from release.yml so a tagged release runs these exact
  # gates before building/publishing anything.
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref so force-pushes / amended PRs
# don't waste runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # ubuntu-24.04 (not 22.04): the embedded-mpv engine must compile and
    # link against the libmpv major every release actually ships — libmpv2
    # (mpv ≥ 0.35, provided by debian:12 / ubuntu-24.04 in release.yml).
    # Jammy only had libmpv1 (mpv 0.34), so its test binaries exercised a
    # different ABI than users run. 24.04 also keeps the apt names resolving
    # exactly like the release workflow's ubuntu-24.04 AppImage job.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable (with clippy + rustfmt)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri system dependencies
        # Tauri v2 (linux) build requirements. libwebkit2gtk-4.1-dev +
        # libsoup-3.0-dev are the v2 webkit/soup headers; the rest are
        # transitive GTK/indicator deps + patchelf (appimage bundling).
        # libmpv-dev is for the embedded-libmpv engine (a DEFAULT Cargo
        # feature — every build links libmpv; see src-tauri/src/mpv/).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libmpv-dev

      - name: Cache Cargo (~/.cargo + src-tauri/target)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      - name: JS dependencies audit (npm audit)
        # Supply-chain advisory scan over package-lock.json. Mirrors the
        # cargo-audit step at the end of this job; runs right after `npm ci`
        # so a vulnerable dependency fails fast before the type-check / lint /
        # build work. Exits non-zero on any advisory (prod or dev). npm audit
        # has no "unmaintained" category (unlike cargo audit) so there is no
        # equivalent ignore list — a new transitive vuln usually clears via the
        # next dependabot bump.
        run: npm audit

      - name: Version drift check
        # Fails fast if package.json / Cargo.toml / Cargo.lock disagree, or a
        # packaging README / PKGBUILD carries a stale hardcoded version. Runs
        # before the type-check so a half-bumped tree is caught immediately.
        run: sh scripts/check-versions.sh

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        # The frontend's counterpart to the cargo fmt gate below: the repo is
        # formatted with Prettier (.prettierrc.json + .prettierignore), so a
        # file drifting from the canonical layout fails here — cheap, and it
        # keeps later diffs free of formatting noise.
        run: npm run format:check

      - name: Frontend tests (Vitest)
        run: npm test

      # `dist/` is gitignored, so a fresh CI checkout doesn't have it — but
      # the Rust crate compiles `tauri::generate_context!()` (src-tauri/src/
      # lib.rs), which embeds tauri.conf.json's `frontendDist` ("../dist") at
      # build time and PANICS if that path is missing. Without this step,
      # cargo clippy/test fail with: "frontendDist ... path doesn't exist".
      - name: Build frontend (required by generate_context!)
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Generate comma-decimal locale (mpv engine test)
        # The one Rust test that creates a real mpv core needs a
        # comma-decimal locale (de_DE/fr_FR) or it silently skips itself —
        # and runners ship none. Generating one makes the mechanism test
        # actually exercise libmpv against the locale that broke it.
        run: |
          command -v locale-gen >/dev/null || sudo apt-get install -y locales
          sudo locale-gen de_DE.UTF-8

      - name: Rust tests
        # --nocapture so the locale test's "mechanism test skipped" eprintln
        # (its only ran-vs-skipped signal) is visible in the log.
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      # AUR state parity: the -git PKGBUILD builds with --no-default-features
      # (updater off — pacman owns updates) but re-adds mpv-embed, so the
      # engine ships on AUR too. That combination compiles nowhere else in
      # CI, so gate it explicitly to keep the AUR build green.
      - name: Clippy (AUR state — updater off, mpv-embed on)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features "mpv-embed,tauri/custom-protocol" --all-targets -- -D warnings

      - name: RustSec audit (cargo audit)
        # Supply-chain advisory scan. The `command -v` guard lets the
        # rust-cache-restored cargo-audit binary skip the install; first run
        # pays the compile once. We deliberately do NOT pass --deny warnings /
        # --deny unmaintained: the gtk3-rs 0.18 stack Tauri v2 pins on Linux
        # (atk/gdk/gtk, glib RUSTSEC-2024-0429) is flagged unmaintained/unsound
        # upstream and would keep CI permanently red. Ignored advisory IDs live
        # in src-tauri/.cargo/audit.toml.
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          cd src-tauri && cargo audit

  # Windows + macOS compile/lint/test parity. The Linux `check` job above
  # covers the platform where development happens; these two entries compile
  # and lint the cfg(windows)/cfg(macos) arms that are dead code on Linux
  # and run the test suite on the platforms the release builds target
  # (NSIS on windows-latest, the arm64 .app/.dmg on macos-latest).
  # Bundling stays in release.yml — this job never builds installers.
  check-os:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # `dist/` is gitignored but generate_context! embeds it at compile
      # time (same reason as the Linux job).
      - name: Build frontend (required by generate_context!)
        run: npm run build

      - name: Install Rust stable (with clippy)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Cache Cargo (~/.cargo + src-tauri/target)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      # tauri.windows.conf.json maps ../streamlink-bundle/ as an NSIS
      # resource and the CLI merges it on every Windows cargo build, so
      # tauri-build's resource copy (ResourcePaths::from_map) fails when
      # the directory is absent. Only the bundler needs the real 150 MB
      # streamlink tree (staged in release.yml); clippy/test just need the
      # mapped path to exist with at least one file.
      - name: "Windows: streamlink-bundle resource placeholder"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p streamlink-bundle
          echo "CI placeholder: tauri.windows.conf.json maps this directory as a resource; the release job stages the real streamlink tree here." > streamlink-bundle/README-placeholder

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
