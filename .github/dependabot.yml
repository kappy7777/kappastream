version: 2
updates:
  # npm — frontend + build tooling (root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 reworks the compiler/transform API that svelte-check and
      # @sveltejs/vite-plugin-svelte build on; bumping to 7.x fails the
      # type-check gate. Stay on 6.x until Svelte tooling supports TS 7.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # cargo — Rust host shell (src-tauri)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    ignore:
      # The gtk-rs 0.19+ line requires a newer gtk4-stack/ Rust edition
      # baseline than Tauri's pinned gtk3 0.18 crates can coexist with:
      # tauri/wry/tao resolve gtk/glib/gio 0.18, and a lone 0.19+ bump of
      # any layer splits the types (gtk::Widget vs gtk4's) and fails the
      # build. Hold every gtk-rs crate at 0.18.x until Tauri moves.
      - dependency-name: "glib"
        versions: [">=0.19"]
      - dependency-name: "gio"
        versions: [">=0.19"]
      - dependency-name: "gtk"
        versions: [">=0.19"]
      - dependency-name: "gdk"
        versions: [">=0.19"]
      - dependency-name: "gdkwayland-sys"
        versions: [">=0.19"]
      - dependency-name: "gdkx11-sys"
        versions: [">=0.19"]

  # github-actions — keep the workflow actions pinned-to-tags but current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
