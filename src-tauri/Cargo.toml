[package]
name = "kappastream"
version = "1.0.4"
description = "A lightweight, anonymous Twitch viewer (live stream, chat, favorites) for Linux, macOS, and Windows"
authors = ["kappy <kappy777@proton.me>"]
license = "GPL-3.0-only"
repository = "https://github.com/kappy7777/kappastream"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# In-app self-update. The `updater` feature is default-on so CI release builds
# (AppImage/.deb/.rpm/NSIS) register the updater + process plugins. AUR builds
# pass `--no-default-features`, which skips the `.plugin(...)` registration in
# lib.rs — so the JS `check()` call rejects immediately and is swallowed
# silently by the frontend, and no AUR user ever sees an update prompt (pacman
# owns updates there; a second self-update path would fight it).
#
# Why the crates are NON-optional even though registration is feature-gated:
# Tauri's capability validator (tauri-build) hard-errors if a capability
# references a permission whose providing plugin is absent from the Cargo
# dependency graph ("Permission updater:default not found"). So the crate must
# remain in the graph for the schema to resolve. In release builds the
# unregistered crates' code is unreferenced and dropped by the linker/LTO, so
# the shipped AUR binary carries no updater runtime — only the build compiles it.
[features]
default = ["updater", "mpv-embed"]
updater = []
# Experimental embedded-libmpv video engine (see src/mpv/mod.rs). IN the
# default set (owner decision 2026-09-16): every release build ships the
# engine, so each platform's packaging carries libmpv — deb/rpm declare it
# in tauri.conf.json (libmpv2 / mpv-libs), the AppImage bundles it via
# linuxdeploy, Windows ships libmpv-2.dll next to the exe (see
# tauri.windows.conf.json + packaging/windows/mpv.def), macOS bundles the
# Homebrew libmpv closure into the .app (packaging/macos/bundle-libmpv.sh
# as beforeBundleCommand + tauri.macos.conf.json), and the AUR packages
# depend on Arch's `mpv`. The ONLY libmpv-free builds are
# `--no-default-features` invocations that don't re-add the feature.
# Note: libmpv2 needs a rustc newer than the crate's rust-version 1.77.2
# floor — the MSRV only holds for --no-default-features builds.
mpv-embed = [
  "dep:libmpv2",
  "dep:libloading",
  "dep:gtk",
  "dep:glib",
  "dep:gdk",
  "dep:gio",
  "dep:webkit2gtk",
  "dep:windows-sys",
  "dep:objc2",
  "dep:objc2-foundation",
  "dep:libc",
  "dep:cairo",
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Direct dep: `tauri::generate_context!()` references `serde_json` at the crate
# root to deserialize `plugins.updater` (and other plugin config) at build time.
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["process", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rfd = "0.17"
url = "2"
# DevTools are enabled by default in debug builds (`tauri dev`). The `devtools`
# Cargo feature is intentionally NOT enabled so production/release builds do
# not ship the web inspector. See tauri.conf.json window `devtools` field.
#
# `macos-private-api` enables wry's transparent-WKWebView path, required by
# the mpv-embed engine on macOS (the video NSView sits BELOW the webview —
# see src/mpv/macos.rs; the flag itself lives in the per-platform overlays,
# see below). Semantically inert on the other targets (the feature is
# cfg-gated to macOS inside wry), but enabled UNCONDITIONALLY in this shared
# [dependencies] entry: tauri-build's allowlist check (its src/manifest.rs)
# requires this manifest's tauri features to EXACTLY equal the merged
# platform config's app.features() on EVERY build target, and one static
# manifest can only satisfy that if every target's config carries the same
# flag. Cargo dependency features also cannot be made per-target in a way
# the check accepts (target-table entries are checked against the CURRENT
# target's expectation too — verified empirically both directions,
# 2026-09-17). That is why ALL THREE overlays (tauri.{linux,windows,macos}
# .conf.json) set macOSPrivateApi:true while the base config stays clean.
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
# Single-instance guard: a second launch (e.g. clicking the dock/AppImage
# while the window is hidden to the tray) surfaces the existing window and
# exits the new process instead of starting a duplicate. Desktop-only.
tauri-plugin-single-instance = "2"
# In-app self-update (tauri-plugin-updater) + relaunch (tauri-plugin-process).
# Non-optional so the capability schema resolves; registration is gated by the
# `updater` feature in lib.rs (see the note above).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2.4.1"
# Embedded libmpv engine (feature `mpv-embed`). Optional so default builds
# never compile — let alone link — against libmpv. `render` (in libmpv2's
# default features) is what lets us draw into a GLArea instead of letting mpv
# create its own window. libloading dlopens libepoxy at runtime for the GL
# proc-address bridge on Linux (see src/mpv/ for why not the stale `epoxy`
# crate). The gtk/glib/webkit2gtk versions deliberately match what
# tauri/wry already resolve to (check Cargo.lock) so they unify — the surface
# module manipulates the very widgets wry created.
libmpv2 = { version = "6", optional = true }
libloading = { version = "0.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
gdk = { version = "0.18", optional = true }
# mpv-embed only: the webkit2gtk snapshot API takes a gio cancellable.
# Version matches what gtk already resolves to so the trees unify.
gio = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", optional = true }
# mpv-embed only: pin LC_NUMERIC back to "C" before creating the libmpv core
# (see pin_c_numeric_locale in src/mpv/mod.rs).
libc = { version = "0.2", optional = true }
# mpv-embed only: the Linux surface's INPUT-PASS-THROUGH region (the empty
# cairo::Region handed to the video EventBox's input_shape_combine_region —
# see src/mpv/linux.rs). Package renamed to the lib name so the code says
# `cairo::…`; version matches what gtk already resolves to so the trees
# unify.
cairo = { version = "0.18", package = "cairo-rs", optional = true }

# UNVERIFIED Windows/macOS mpv surfaces (see src/mpv/win32.rs + macos.rs):
# raw child-HWND / NSView plumbing. Versions match what tauri already
# resolves so the dependency trees unify.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSGeometry"] }

[dev-dependencies]
# Used in resolve.rs tests to set/unset env vars without mutating the global
# process environment (which would race under `cargo test`'s parallel runner).
temp-env = "0.3"
